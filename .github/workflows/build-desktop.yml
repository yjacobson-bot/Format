name: Build Desktop EXE

on:
  push:
    branches: [claude/lucid-shannon-6ask8a, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download and bundle LibreOffice Portable
        shell: powershell
        run: |
          $url = "https://download.documentfoundation.org/libreoffice/portable/24.8.7/LibreOfficePortablePrevious_24.8.7_MultilingualAll.paf.exe"
          $installer = "$env:TEMP\lo_installer.exe"
          Write-Host "Downloading LibreOffice Portable..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Download complete. Size: $([math]::Round((Get-Item $installer).Length / 1MB, 1)) MB"
          New-Item -ItemType Directory -Force -Path "resources\libreoffice" | Out-Null
          Write-Host "Extracting with 7-Zip..."
          & "C:\Program Files\7-Zip\7z.exe" x $installer -o"resources\libreoffice" -y
          Write-Host "Done. Top-level files:"
          Get-ChildItem "resources\libreoffice" | Select-Object -First 10
          Write-Host "Searching for soffice.exe..."
          Get-ChildItem "resources\libreoffice" -Recurse -Filter "soffice.exe" | Select-Object FullName
          Write-Host "Searching for LibreOfficePortable.exe..."
          Get-ChildItem "resources\libreoffice" -Recurse -Filter "LibreOfficePortable.exe" | Select-Object FullName
        working-directory: desktop

      - name: Build Windows EXE
        run: npm run build:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Format-Factory-Windows-EXE
          path: desktop/dist/*.exe
          retention-days: 90

      - name: Delete existing release and tag if present
        shell: bash
        run: |
          gh release delete v2.6.0 --yes --cleanup-tag 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.6.0
          name: פורמט נקי v2.6.0
          draft: false
          prerelease: false
          files: desktop/dist/*.exe
          body: |
            ## פורמט נקי v2.6.0 — Windows

            **מתקין:** הורד `*-Setup.exe` והתקן רגיל.
            **נייד:** הורד `*-Portable.exe` — הפעל ישירות ללא התקנה, לא כותב לרג'יסטרי.

            ### חדש בגירסה 2.6
            - 📄 המרת מסמכים: PDF → Word / טקסט / ODT / RTF — כלול בתוכנה, ללא הורדה נוספת
            - LibreOffice Portable מוטמע מראש בתוך המתקין (~440MB סה"כ)
            - הסרת התוכנה מוחקת הכל אוטומטית

            ### תיקוני באגים בגירסה 2.5.0
            - תיקון קריטי: סימן מים כיסה את כל הוידאו — קנה מידה חושב יחסית לסימן המים עצמו, עכשיו יחסי לוידאו
            - תיקון: סימן מים בטאב המתקדם לא הוחל — שם key שגוי (watermarkFile במקום watermarkPath)
            - תיקון: "ללא אודיו" לא עשה כלום — -an לא נשלח לffmpeg
            - תיקון: GIF/rotate עם גווני אפור נכשל — ffmpeg קיבל ערך עירום אחרי סינון -vf
            - תיקון: "נקה הכל" לא עצר ffmpeg — תהליכים המשיכו ברקע
            - תיקון: אותה משימה יכלה להתחיל פעמיים — race condition ב-processQueue
            - תיקון: בוחר קבצי כתוביות וסימן מים לא עבד — undefined במקום נתיב
            - תיקון: תצוגת מידע קבצים (משך, רזולוציה, קודק) תמיד הציגה "—"
            - תיקון: TrimEditor תמיד עבד עם 300 שניות ברירת מחדל
            - תיקון: המרת אודיו (MP3/AAC/FLAC) נכשלה עם "Option preset not found"
            - תיקון: חיתוך מרובה על קובץ אודיו נכשל פעמיים
            - תיקון: GPU fallback התקדמות תמיד הציגה 0%
            - תיקון: נתיבים עם גרש במיזוג קבצים

            ### חדש בגירסה 2.4
            - סימן מים: תצוגה מקדימה חיה עם הסימן מים מוטמע, סליידר גודל 1–30%, מוסיף לתור ההמרות
            - ידיות חיתוך: ירוקה ▶ = התחלה, אדומה ◀ = סוף — ברור בכל מקום בתוכנה
            - כפתור ▶ לכל קטע בחיתוך מרובה — מנגן רק את הקטע הנבחר
            - תיקון קריטי: כלי הסרגל (היפוך, סיבוב, מהירות, נרמול, fade) לא החילו שום פילטר
            - חיתוך מרובה עם נגן וידיות גרירה: כל קטע מקבל ציר צבעוני עם שתי ידיות
            - חיתוך מרובה זמין גם מתוך חלון המרת אודיו (טאב "חיתוך מרובה")

            ### מגירסה 2.2
            - חיתוך מרובה: בחר כמה קטעים מקובץ אחד — ייצוא לקובץ אחד מחובר או לקבצים נפרדים
            - מצב רקע: המרה בעדיפות נמוכה — המחשב נשאר שוטף
            - מיזוג אודיו בו-זמני עם בקרת עוצמה לכל רצועה (0–200%)
            - שליטה בשרשורי מעבד: אופטימלי / מקסימלי / ידני / רקע

            ### כללי
            - 🎬 המרת וידאו, 🎵 אודיו, 🖼️ תמונות, 📀 DVD/ISO
            - 🛠 כלים: מיזוג, חיתוך, סיבוב, היפוך, שינוי מהירות, נרמול, fade
            - ⚡ פרופילים מהירים: iPhone, YouTube, DVD, Instagram ועוד
            - 📊 התקדמות מדויקת עם מהירות וזמן נותר
            - 💤 אפשרות כיבוי מחשב בסיום
            - ✅ 100% אופליין — FFmpeg מובנה
            - 🔒 ללא טלמטריה
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
