name: Build Desktop EXE

on:
  push:
    branches: [claude/lucid-shannon-6ask8a, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run build:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Format-Factory-Windows-EXE
          path: desktop/dist/*.exe
          retention-days: 90

      - name: Delete existing release and tag if present
        shell: bash
        run: |
          gh release delete v2.1.0 --yes --cleanup-tag 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.1.0
          name: פורמט נקי v2.1.0
          draft: false
          prerelease: false
          files: desktop/dist/*.exe
          body: |
            ## פורמט נקי v2.1.0 — Windows Installer

            הורד את קובץ ה-`.exe` למטה והתקן.

            ### חדש בגירסה 2.1
            - מיזוג אודיו בו-זמני: שני שירים/רצועות מעורבים יחד עם בקרת עוצמה לכל רצועה (0–200%)
            - שליטה בשרשורי מעבד: אופטימלי / מקסימלי / ידני
            - ממשק GPU משופר: בחירת כרטיס גרפי ויזואלית וברורה
            - עיצוב מקצועי: אייקוני SVG במקום אמוג'ים בכל הממשק
            - חלוקת שרשורים פרופורציונלית בין המרות מקביליות

            ### כללי
            - 🎬 המרת וידאו, 🎵 אודיו, 🖼️ תמונות, 📀 DVD/ISO
            - 🛠 כלים: מיזוג, חיתוך, סיבוב, היפוך, שינוי מהירות, נרמול, fade
            - ⚡ פרופילים מהירים: iPhone, YouTube, DVD, Instagram ועוד
            - 📊 התקדמות מדויקת עם מהירות וזמן נותר
            - 💤 אפשרות כיבוי מחשב בסיום
            - ✅ 100% אופליין — FFmpeg מובנה
            - 🔒 ללא טלמטריה
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
