name: Build Desktop EXE

on:
  push:
    branches: [claude/lucid-shannon-6ask8a, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run build:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Format-Factory-Windows-EXE
          path: desktop/dist/*.exe
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.5.0
          name: Format Factory v1.5.0
          draft: false
          prerelease: false
          files: desktop/dist/*.exe
          body: |
            ## Format Factory — Windows Installer

            הורד את קובץ ה-`.exe` למטה והתקן.

            - 🎬 המרת וידאו, 🎵 אודיו, 🖼️ תמונות, 📀 DVD/ISO
            - ✅ 100% אופליין — FFmpeg מובנה
            - 🔒 ללא טלמטריה
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
