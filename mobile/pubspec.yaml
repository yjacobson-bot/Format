name: format_factory
description: Open-source multimedia converter for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_flutter_full_gpl: ^6.0.3
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  provider: ^6.1.1
  permission_handler: ^11.3.0
  share_plus: ^9.0.0
  open_file: ^3.3.2
  uuid: ^4.3.3
  sqflite: ^2.3.2
  intl: ^0.19.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
